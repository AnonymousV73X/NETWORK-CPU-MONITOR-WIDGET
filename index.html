<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap');

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100vw;
      height: 100vh;
      background: transparent;
      overflow: hidden;
      font-family: 'Outfit', 'Segoe UI', sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-app-region: no-drag;
    }

    body {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      pointer-events: none;
    }

    .pill {
      position: relative;
      display: grid;
      grid-template-columns: 110px 1px 110px 1px 60px;
      align-items: center;
      width: 300px;
      height: 55px;
      border-radius: 999px;
      overflow: hidden;
      pointer-events: auto;
      cursor: default;

      background: linear-gradient(135deg, #0a2e1a, #0a1232);
      border: 1px solid rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(14px) saturate(1.4);
      -webkit-backdrop-filter: blur(14px) saturate(1.4);

      padding-left: 15px;
      margin-top: 2px;
    }

    .pill::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 40%;
      border-radius: 999px 999px 0 0;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.18) 0%, transparent 100%);
      pointer-events: none;
    }

    .pill::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 40%;
      border-radius: 0 0 999px 999px;
      background: linear-gradient(0deg, rgba(0, 0, 0, 0.18) 0%, transparent 100%);
      pointer-events: none;
    }

    .seg {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      height: 100%;
    }

    .sep {
      width: 1px;
      height: 36px;
      flex-shrink: 0;
      background: linear-gradient(180deg, transparent, rgba(255, 255, 255, 0.28), transparent);
      position: relative;
      z-index: 1;
    }

    .arrow {
      font-size: 26px;
      font-weight: 800;
      line-height: 1.5;
      flex-shrink: 0;
      font-family: Tahoma, Geneva, Verdana, sans-serif;
      margin-bottom: 9px;
    }

    .up {
      color: #1ecf68;
      filter: drop-shadow(0 0 5px rgba(30, 207, 104, 0.65));
    }

    .dn {
      color: #3b9fff;
      filter: drop-shadow(0 0 5px rgba(59, 159, 255, 0.65));
    }

    .info {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      width: 76px;
      flex-shrink: 0;
    }

    .valrow {
      display: flex;
      align-items: baseline;
      gap: 3px;
    }

    .val {
      font-size: 16px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.90);
      letter-spacing: -0.01px;
      font-variant-numeric: tabular-nums;
    }

    .unit {
      font-size: 12px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.48);
      margin-bottom: 1px;
    }

    .lbl {
      font-size: 10px;
      color: white;
      letter-spacing: 0.3px;
      margin-top: 4px;
    }

    .confirm {
      position: fixed;
      left: 50%;
      top: 62px;
      transform: translateX(-50%);
      background: rgba(14, 14, 24, 0.95);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 10px;
      padding: 8px 10px 8px 14px;
      z-index: 9999;
      white-space: nowrap;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.55);
      display: none;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
      font-family: 'Outfit', 'Segoe UI', sans-serif;
    }

    .confirm.show {
      display: flex;
    }

    .confirm-txt {
      font-size: 11px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.70);
    }

    .confirm-yes {
      font-size: 11px;
      font-weight: 600;
      font-family: 'Outfit', 'Segoe UI', sans-serif;
      color: #ff5f57;
      background: rgba(255, 95, 87, 0.12);
      border: 1px solid rgba(255, 95, 87, 0.30);
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
    }

    .confirm-yes:hover {
      background: rgba(255, 95, 87, 0.24);
    }

    .confirm-no {
      font-size: 11px;
      font-weight: 600;
      font-family: 'Outfit', 'Segoe UI', sans-serif;
      color: rgba(255, 255, 255, 0.55);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
    }

    .confirm-no:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .confirm-reset {
      font-size: 11px;
      font-weight: 600;
      font-family: 'Outfit', 'Segoe UI', sans-serif;
      color: #3b9fff;
      background: rgba(59, 159, 255, 0.12);
      border: 1px solid rgba(59, 159, 255, 0.30);
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
    }

    .confirm-reset:hover {
      background: rgba(59, 159, 255, 0.24);
    }

    .confirm-unit {
      font-size: 11px;
      font-weight: 600;
      font-family: 'Outfit', 'Segoe UI', sans-serif;
      color: #c084fc;
      background: rgba(192, 132, 252, 0.12);
      border: 1px solid rgba(192, 132, 252, 0.30);
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
    }

    .confirm-unit:hover {
      background: rgba(192, 132, 252, 0.24);
    }
  </style>
</head>

<body>

  <div class="pill" id="pill">
    <div class="seg">
      <span class="arrow up">↑</span>
      <div class="info">
        <div class="valrow">
          <span class="val" id="uv" style="color:#1ecf68">0</span>
          <span class="unit" id="uu">Mbps</span>
        </div>
        <span class="lbl">Uplink</span>
      </div>
    </div>

    <div class="sep" style="margin-left:-10px"></div>

    <div class="seg">
      <span class="arrow dn">↓</span>
      <div class="info">
        <div class="valrow">
          <span class="val" id="dv" style="color:#3b9fff">0</span>
          <span class="unit" id="du">Mbps</span>
        </div>
        <span class="lbl">Downlink</span>
      </div>
    </div>

    <div class="sep" style="margin-left:-10px"></div>

    <div class="seg" style="justify-content:flex-start; padding-left:10px;">
      <div class="info" style="width:44px;">
        <div class="valrow">
          <span class="val" id="cv" style="color:orange">0</span>
          <span class="unit">%</span>
        </div>
        <span class="lbl">CPU</span>
      </div>
    </div>
  </div>

  <div class="confirm" id="confirm">
    <span class="confirm-txt">Close widget?</span>
    <button class="confirm-yes" id="cyes">Exit</button>
    <button class="confirm-unit" id="cunit">→ B/s</button>
    <button class="confirm-reset" id="creset">Reset</button>
    <button class="confirm-no" id="cno">Cancel</button>
  </div>

  <script>
    const uvEl = document.getElementById('uv')
    const uuEl = document.getElementById('uu')
    const dvEl = document.getElementById('dv')
    const duEl = document.getElementById('du')
    const cvEl = document.getElementById('cv')

    // Unit toggle: true = bits (Mbps), false = bytes (MBps)
    let useBits = true;

    function fmt(v) {
      if (!useBits) v = v / 8; // convert Mbps → MBps
      const G = useBits ? 'Gbps' : 'GBps';
      const M = useBits ? 'Mbps' : 'MBps';
      const K = useBits ? 'Kbps' : 'KBps';
      if (v >= 1000) return [+(v / 1000).toFixed(1), G]
      if (v >= 10)   return [Math.round(v), M]
      if (v >= 1)    return [+v.toFixed(1), M]
      return [Math.round(v * 1000), K]
    }

    let busy = false
    async function tick() {
      if (busy) return
      busy = true
      try {
        const s = await window.api.stats()
        const [uv, uu] = fmt(s.up)
        const [dv, du] = fmt(s.dn)
        uvEl.textContent = uv; uuEl.textContent = uu
        dvEl.textContent = dv; duEl.textContent = du
        cvEl.textContent = Math.round(s.cpu)
      } catch (_) { }
      busy = false
    }
    tick()
    setInterval(tick, 1000)

    // dblclick confirm tooltip
    const confirm = document.getElementById('confirm')
    const pill = document.getElementById('pill')
    let closeTimer = null

     function showConfirm() {
      confirm.classList.add('show')
      window.api.setConfirmStatus(true)
      clearTimeout(closeTimer)
      closeTimer = setTimeout(hideConfirm, 4000) // auto-dismiss after 4s
    }

    function hideConfirm() {
      confirm.classList.remove('show')
      window.api.setConfirmStatus(false)
      clearTimeout(closeTimer)
    }

    pill.addEventListener('contextmenu', e => {
      e.preventDefault()
      showConfirm()
    })

    document.getElementById('cyes').addEventListener('click', async () => {
      hideConfirm()
      await window.api.quit()
    })

    document.getElementById('cno').addEventListener('click', () => hideConfirm())

    document.getElementById('cunit').addEventListener('click', () => {
      useBits = !useBits;
      document.getElementById('cunit').textContent = useBits ? '→ B/s' : '→ b/s';
    })

    document.getElementById('creset').addEventListener('click', () => {
      hideConfirm()
      window.api.resetPosition()
    })

    // click outside dismisses
    document.addEventListener('pointerdown', e => {
      if (confirm.classList.contains('show') &&
        !confirm.contains(e.target) &&
        !pill.contains(e.target)) {
        hideConfirm()
      }
    })

    // Dragging logic — all coordinates in screen space to avoid clientX/screenX mismatch
    let isDragging = false;
    let grabOffsetX = 0; // cursor offset from the left edge of the window at drag start

    pill.addEventListener('pointerdown', (e) => {
      if (e.button !== 0 || e.target.closest('.confirm')) return;
      isDragging = true;
      // e.clientX = cursor position relative to the window (pill) left edge
      // We store this so we can subtract it from screenX on each move
      grabOffsetX = e.clientX;
      pill.setPointerCapture(e.pointerId);
      window.api.setDragStatus(true);
      console.log(`[DRAG START] clientX: ${e.clientX}, screenX: ${e.screenX}, grabOffsetX: ${grabOffsetX}`);
    });

    pill.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      // screenX = absolute cursor position on screen
      // grabOffsetX = how far from the window left edge we grabbed
      // => new window left edge = screenX - grabOffsetX
      const newWindowX = e.screenX - grabOffsetX;
      console.log(`[DRAG MOVE] screenX: ${e.screenX}, grabOffsetX: ${grabOffsetX}, newWindowX: ${newWindowX}`);
      window.api.setWindowPosition({ x: newWindowX });
    });

    const stopDragging = (e) => {
      if (isDragging) {
        try {
          pill.releasePointerCapture(e.pointerId);
        } catch (_) {}
        isDragging = false;
        window.api.setDragStatus(false);
        console.log('[DRAG END]');
      }
    };

    pill.addEventListener('pointerup', stopDragging);
    pill.addEventListener('pointercancel', stopDragging);
  </script>
</body>

</html>
